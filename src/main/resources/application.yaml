server:
  port: 8761

  # Gracefully wait for existing requests to complete
  shutdown: graceful

  # Connection/read timeouts
  tomcat:
    connection-timeout: 5s

spring:
  application:
    name: DISCOVERY-SERVICE

  # Graceful shutdown
  lifecycle:
    timeout-per-shutdown-phase: 30s

eureka:
  client:
    # Eureka server should not register itself
    register-with-eureka: false

    # Eureka server does not need to fetch its own registry
    fetch-registry: false

    # Client communication settings
    service-url:
      defaultZone: http://localhost:8761/eureka/

  server:
    # Give clients some time to recover before removing them
    enable-self-preservation: true

    # Time between registry cleanup operations
    eviction-interval-timer-in-ms: 10000

    # Don't aggressively remove instances during temporary network issues
    renewal-percent-threshold: 0.85

    # Response cache update interval
    response-cache-update-interval-ms: 3000

    # Response cache expiration
    response-cache-auto-expiration-in-seconds: 180

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO

info:
  app:
    name: ${spring.application.name}
    description: Eureka Discovery Server